name: Android build

on:
  push:
    branches:
      - main
      - codex/moonmew-foundation
      - fix/ime-selection-sync
  pull_request:
    branches:
      - main

permissions:
  contents: write

# Serialize main-branch builds so an older run cannot overwrite a newer APK
# on the shared "latest" release after finishing late.
concurrency:
  group: moonmew-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: moonmew-debug-signing-key-v1
      - name: Ensure stable debug signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -storetype JKS \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonmew-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
      - name: Publish latest test APK to GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/moonmew-foundation')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MoonMew Keyboard - Latest test build
          body: |
            Automatically generated debug APK from the latest successful MoonMew build.
            This is a test build, not a signed Play Store release.
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
