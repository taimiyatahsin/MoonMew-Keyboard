name: Android build

on:
  push:
    branches:
      - main
      - codex/moonmew-foundation
      - fix/ime-selection-sync
  # Run CI for every PR target, including stacked feature branches.
  pull_request:

# PR builds and tests need repository read access only.
permissions:
  contents: read

# Serialize main-branch builds so an older run cannot overwrite a newer APK
# on the shared "latest" release after finishing late.
concurrency:
  group: moonmew-${{ github.ref }}
  # Cancel stale PR runs so a newer commit is not blocked by a stuck emulator.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  debug-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: moonmew-debug-signing-key-v1
      - name: Ensure stable debug signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -storetype JKS -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonmew-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

  emulator-smoke:
    needs: debug-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 35]
    name: IME smoke test (Android API ${{ matrix.api-level }})
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run IME smoke test on Android API ${{ matrix.api-level }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
          ANDROID_API_LEVEL: ${{ matrix.api-level }}
        with:
          api-level: ${{ matrix.api-level }}
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          disable-animations: true
          script: bash .github/scripts/emulator-ime-smoke.sh
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonmew-emulator-diagnostics-api-${{ matrix.api-level }}
          path: emulator-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  # Only trusted pushes to the release branches receive write permission.
  publish-test-apk:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/moonmew-foundation')
    needs: debug-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download successful debug APK
        uses: actions/download-artifact@v4
        with:
          name: moonmew-debug-apk
          path: release-assets
      - name: Publish latest test APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MoonMew Keyboard - Latest test build
          body: |
            Automatically generated debug APK from the latest successful MoonMew build.
            This is a test build, not a signed Play Store release.
          prerelease: true
          make_latest: false
          files: release-assets/app-debug.apk
          overwrite_files: true
