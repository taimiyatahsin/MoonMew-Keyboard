name: Android build

on:
  push:
    branches:
      - main
      - codex/moonmew-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonmew-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
      - name: Publish latest test APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/moonmew-foundation'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MoonMew Keyboard - Latest test build
          body: |
            Automatically generated debug APK from the latest successful MoonMew development build.
            This is a test build, not a signed Play Store release.
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
